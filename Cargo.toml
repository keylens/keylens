[workspace]
resolver = "3"
members = [
    "crates/keylens",
    "crates/keylens-conn",
    "crates/keylens-lens",
    "crates/keylens-ui",
    "crates/lenses/keylens-bullmq",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/keylens/keylens"
homepage = "https://github.com/keylens/keylens"
authors = ["Dennis Paler"]

[workspace.dependencies]
# Internal
keylens-conn = { path = "crates/keylens-conn", version = "0.1.0-dev" }
keylens-lens = { path = "crates/keylens-lens", version = "0.1.0-dev" }
keylens-ui = { path = "crates/keylens-ui", version = "0.1.0-dev" }
keylens-bullmq = { path = "crates/lenses/keylens-bullmq", version = "0.1.0-dev" }

# Redis. Interface features are enumerated rather than `i-all` to keep compile
# times sane -- adding a command family means adding its `i-*` feature here.
fred = { version = "10.1", default-features = false, features = [
    "i-keys",
    "i-hashes",
    "i-lists",
    "i-sets",
    "i-sorted-sets",
    "i-streams",
    "i-scripts",
    "i-server",
    "i-client",
    "i-cluster",
    "i-config",
    "i-memory",
    "i-pubsub",
    "i-slowlog",
    "i-std",
    "enable-rustls-ring",
    "sentinel-client",
    "subscriber-client",
    "replicas",
] }

# Async
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
async-trait = "0.1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-tree-widget = "0.24"
tui-textarea = "0.7"

# CLI / config
clap = { version = "4.6", features = ["derive", "env"] }
toml = "1.1"
directories = "6.0"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors / diagnostics
color-eyre = "0.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Formatting helpers
bytesize = "2.5"
humantime = "2.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
