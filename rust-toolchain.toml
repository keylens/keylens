# Pinned, not `stable`.
#
# A floating channel means CI's lint set changes underneath the repo: `cargo clippy -- -D
# warnings` is a gate, and every new stable can add a lint that turns it red on a commit
# that changed nothing. Bumping this is then a deliberate, reviewable change with the
# lint fixes in the same diff.
#
# Keep at or above `rust-version` in the workspace manifest; the MSRV job checks the floor.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
