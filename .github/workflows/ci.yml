name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # A new advisory lands against a lockfile that has not changed, so the supply-chain job
  # needs a trigger that does not depend on anyone pushing.
  schedule:
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Format ────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned + rustfmt)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ─── Minimum supported Rust ────────────────────────────────────────────────
  msrv:
    name: MSRV (Rust 1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This job must NOT pick up the pinned toolchain from rust-toolchain.toml, or it
      # would silently re-check the newest compiler and stop testing the floor entirely.
      # It doesn't: the action exports RUSTUP_TOOLCHAIN, which outranks the toolchain file.
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Confirm the MSRV toolchain is the one in use
        run: |
          cargo --version
          cargo --version | grep -q 'cargo 1\.90\.' \
            || { echo "::error::MSRV job is not running on 1.90 — rust-toolchain.toml won"; exit 1; }

      - name: cargo check on declared MSRV
        run: cargo check --workspace --all-targets

  # ─── Workflow lint ─────────────────────────────────────────────────────────
  #
  # GitHub only reports an invalid workflow *after* it's pushed, and a broken
  # release.yml is discovered at the worst possible moment — while tagging.
  # actionlint checks expression contexts (e.g. `secrets` is not usable in a
  # job-level `if`) and shellchecks every `run:` block.
  actions:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: actionlint
        run: ./actionlint -color

  # ─── Supply chain ──────────────────────────────────────────────────────────
  #
  # Advisories, licences, banned crates and yanked versions. Added after a manual
  # audit turned up an unsound `lru` (RUSTSEC-2026-0253, reached through ratatui)
  # and a yanked `bytesize` that had both been sitting in Cargo.lock unnoticed.
  # Runs on a schedule as well as on push: a new advisory lands against code that
  # has not changed, so commit-triggered checks alone would never see it.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # ─── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned + clippy)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─── Test (cross-platform) ─────────────────────────────────────────────────
  #
  # The whole suite, not just --lib: the render tests drive real ratatui buffers
  # and the guard test greps the source for banned commands. Both are hermetic —
  # no terminal, no Redis. The live tests are #[ignore] and run in the job below.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

  # ─── Live tests against real Redis + Valkey ────────────────────────────────
  #
  # This is the job that catches upstream drift. BullMQ renames a hash field or
  # Redis changes how a command answers, and no amount of mocking would tell us.
  live:
    name: Live (Redis + Valkey + BullMQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Start fixtures
        run: docker compose up -d --build --wait

      - name: Let the producer build a backlog
        # The live tests assert on failed jobs with stack traces, a populated events
        # stream and a consumer group with pending entries. All of that needs the
        # producer to have actually run for a bit.
        run: sleep 45

      - name: cargo test --test live
        run: cargo test --test live -- --ignored

      - name: Fixture logs on failure
        if: failure()
        run: docker compose logs --tail 100

  # ─── Build check (all platforms) ───────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: cross build (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}
