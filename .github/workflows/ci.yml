name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # A new advisory lands against a lockfile that has not changed, so the supply-chain job
  # needs a trigger that does not depend on anyone pushing.
  schedule:
    - cron: "0 7 * * 1"

# Read-only by default. No job in CI needs to write anything to the repository, and a
# token that can is a token a compromised dependency or action could use.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Format ────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned + rustfmt)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ─── Minimum supported Rust ────────────────────────────────────────────────
  msrv:
    name: MSRV (Rust 1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `rust-toolchain.toml` pins the *development* toolchain, and rustup ranks that file
      # above the default this action sets — so installing 1.90 and stopping there gets you
      # a job that quietly checks the newest compiler instead of the floor. `+1.90.0` on the
      # command outranks the file; the env var below does too, and is here so any cargo
      # call added to this job later inherits it rather than needing to remember the `+`.
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.90.0

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Confirm the MSRV toolchain is the one in use
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          cargo +1.90.0 --version
          cargo +1.90.0 --version | grep -q 'cargo 1\.90\.' \
            || { echo "::error::MSRV job is not running on 1.90 — rust-toolchain.toml won"; exit 1; }

      - name: cargo check on declared MSRV
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: cargo +1.90.0 check --workspace --all-targets

  # ─── Workflow lint ─────────────────────────────────────────────────────────
  #
  # GitHub only reports an invalid workflow *after* it's pushed, and a broken
  # release.yml is discovered at the worst possible moment — while tagging.
  # actionlint checks expression contexts (e.g. `secrets` is not usable in a
  # job-level `if`) and shellchecks every `run:` block.
  actions:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A pinned release, checked against its published sha256 -- not a script piped
      # from the tip of someone else's `main` branch into bash.
      - name: Install actionlint 1.7.12 (checksum-verified)
        run: |
          set -euo pipefail
          V=1.7.12
          F="actionlint_${V}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${V}/${F}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${F}" | sha256sum -c -
          tar -xzf "${F}" actionlint

      - name: actionlint
        run: ./actionlint -color

      # The installer is the one piece of shell users pipe into theirs.
      - name: shellcheck install.sh
        run: shellcheck install.sh .github/scripts/test-install.sh

  # ─── Installer ─────────────────────────────────────────────────────────────
  #
  # install.sh against a fake release served locally: a good archive installs, a tampered
  # one and an unlisted one are refused with nothing written. Both platforms it supports.
  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install.sh verifies checksums
        run: bash .github/scripts/test-install.sh

  # ─── Supply chain ──────────────────────────────────────────────────────────
  #
  # Advisories, licences, banned crates and yanked versions. Added after a manual
  # audit turned up an unsound `lru` (RUSTSEC-2026-0253, reached through ratatui)
  # and a yanked `bytesize` that had both been sitting in Cargo.lock unnoticed.
  # Runs on a schedule as well as on push: a new advisory lands against code that
  # has not changed, so commit-triggered checks alone would never see it.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # ─── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned + clippy)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─── Test (cross-platform) ─────────────────────────────────────────────────
  #
  # The whole suite, not just --lib: the render tests drive real ratatui buffers
  # and the guard test greps the source for banned commands. Both are hermetic —
  # no terminal, no Redis. The live tests are #[ignore] and run in the job below.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo test
        run: cargo test --workspace

  # ─── Live tests against real Redis + Valkey ────────────────────────────────
  #
  # This is the job that catches upstream drift. BullMQ renames a hash field or
  # Redis changes how a command answers, and no amount of mocking would tell us.
  live:
    name: Live (Redis + Valkey + BullMQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Start fixtures
        run: docker compose up -d --build --wait

      - name: Let the producer build a backlog
        # The live tests assert on failed jobs with stack traces, a populated events
        # stream and a consumer group with pending entries. All of that needs the
        # producer to have actually run for a bit.
        run: sleep 45

      - name: cargo test --test live
        run: cargo test --test live -- --ignored

      # Real servers behind a proxy that blackholes, refuses and severs on demand, plus
      # ACL users created and deleted by the tests. Serial: the ACL tests share counters.
      - name: cargo test --test faults
        run: cargo test --test faults -- --ignored --test-threads 1

      - name: Fixture logs on failure
        if: failure()
        run: docker compose logs --tail 100

  # ─── Build check (all platforms) ───────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cross

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: cargo build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: cross build (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --locked --release --target ${{ matrix.target }}
